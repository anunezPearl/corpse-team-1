<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Word Chain</title>
  <style>
    :root {
      --red: #ff1744;
      --background: #0a0a12;
      --surface: #1a1a2e;
      --border: #444;
      --muted: #bbb;
      --button-text: #fff;
      --feedback-error: #ff8a9c;
      --feedback-success: #73e6a1;
      --game-over-a: #200;
      --game-over-b: #300;
      --frank-gradient: linear-gradient(135deg, #ff00cc, #3333ff, #00ffcc, #ffee00);
    }
    :root[data-theme="aurora"] {
      --red: #0b9b8a;
      --background: #071b1c;
      --surface: #103337;
      --border: #3c7370;
      --muted: #b7d8d3;
      --button-text: #f5fffd;
      --feedback-error: #ffc675;
      --feedback-success: #89e0b2;
      --game-over-a: #15302c;
      --game-over-b: #20473e;
      --frank-gradient: linear-gradient(135deg, #075b58, #1a8c78, #bba738, #ec7c4f);
    }
    :root[data-theme="candy"] {
      --red: #e53682;
      --background: #25142b;
      --surface: #442341;
      --border: #a3558d;
      --muted: #f2cae0;
      --button-text: #fff9fc;
      --feedback-error: #ffbd59;
      --feedback-success: #9ee6d1;
      --game-over-a: #4d163c;
      --game-over-b: #702451;
      --frank-gradient: linear-gradient(135deg, #e53682, #8e5fc5, #4db7ae, #ffc655);
    }
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      text-align: center;
      background: var(--background);
      color: #f4f4f4;
      overflow-x: hidden;
    }
    body.shaking { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    #langBar { display: flex; justify-content: flex-end; gap: 6px; padding-top: 10px; }
    #langBar button {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 0.85rem;
    }
    #langBar button.active { background: var(--red); color: var(--button-text); border-color: var(--red); }
    #themeSelect {
      background: var(--surface); color: #f4f4f4; border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 8px; font-size: 0.85rem;
    }

    #urgentBanner {
      margin-top: 10px;
      background: var(--red);
      color: var(--button-text);
      font-weight: bold;
      letter-spacing: 1px;
      padding: 8px;
      border-radius: 6px;
      animation: pulse 1s infinite;
      text-shadow: 0 0 6px #000;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--red); }
      50% { opacity: 0.75; box-shadow: 0 0 22px var(--red); }
    }

    #timer {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--red);
      text-shadow: 0 0 10px var(--red);
      margin: 8px 0 0;
    }
    #timer.critical { animation: pulse 0.3s infinite; }

    h1 { font-size: 2.2rem; margin: 10px 0 4px; text-shadow: 0 0 8px var(--red); }
    #subtitle { color: var(--muted); margin-bottom: 20px; }

    input {
      font-size: 1.2rem; padding: 8px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface); color: #fff;
    }
    button {
      font-size: 1.2rem; padding: 8px 16px; border-radius: 4px;
      border: 1px solid var(--red); background: var(--red); color: var(--button-text); cursor: pointer;
    }
    button:hover { filter: brightness(1.15); }
    button:disabled { cursor: wait; opacity: 0.6; }

    #chain { margin-top: 20px; font-size: 1.3rem; min-height: 1.5em; line-height: 1.7; }
    #feedback { min-height: 1.5em; margin-top: 8px; color: var(--feedback-error); }
    #feedback.success { color: var(--feedback-success); }

    #gameOver {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border: 2px solid var(--red);
      border-radius: 8px;
      background: repeating-linear-gradient(45deg, var(--game-over-a), var(--game-over-a) 10px, var(--game-over-b) 10px, var(--game-over-b) 20px);
    }
    #gameOver h2 { color: var(--red); font-size: 2rem; margin: 0 0 6px; text-shadow: 0 0 12px var(--red); }

    #frankSection {
      margin-top: 36px; padding: 16px; border-radius: 10px;
      background: var(--frank-gradient);
      background-size: 400% 400%;
      animation: gradientShift 6s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    #frankSection h3 { margin-top: 0; text-shadow: 1px 1px 2px #000; }
    #frankSection button { background: #111; border-color: #111; }
    #frankImg { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
    #frankStatus { font-size: 0.95rem; margin-top: 10px; min-height: 1.2em; }
    #songSection { margin-top: 18px; padding: 14px; border: 1px solid rgb(255 255 255 / 35%); border-radius: 8px; background: rgb(0 0 0 / 25%); text-align: left; }
    #songSection h3 { margin: 0 0 8px; }
    #songStatus { min-height: 1.2em; font-size: 0.9rem; }
    #songRecommendation { margin: 12px 0 0; padding: 12px; border-left: 4px solid var(--red); background: rgb(0 0 0 / 24%); white-space: pre-wrap; font: inherit; line-height: 1.45; }
    #songBtn { margin-top: 10px; font-size: 0.95rem; padding: 6px 10px; }

    #settingsToggle {
      position: fixed; bottom: 10px; right: 10px; opacity: 0.5;
      background: #222; border-color: #444; font-size: 0.8rem; padding: 4px 8px;
    }
    #settingsPanel {
      display: none; position: fixed; bottom: 40px; right: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; width: 260px; text-align: left;
    }
    #settingsPanel label { font-size: 0.75rem; color: #aaa; display: block; margin-top: 6px; }
    #settingsPanel input { width: 100%; font-size: 0.85rem; padding: 4px; }
    #settingsPanel button { font-size: 0.8rem; padding: 4px 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="langBar">
    <button id="langEn" class="active" onclick="setLang('en')">EN</button>
    <button id="langEs" onclick="setLang('es')">ES</button>
    <select id="themeSelect" aria-label="Theme" onchange="setTheme(this.value)">
      <option value="midnight">Midnight</option>
      <option value="aurora">Aurora</option>
      <option value="candy">Candy</option>
    </select>
  </div>

  <div id="urgentBanner" data-i18n="urgent">⚠ THE CHAIN MUST NOT BREAK ⚠</div>
  <div id="timer">15</div>

  <h1 data-i18n="title">Word Chain</h1>
  <p id="subtitle" data-i18n="subtitle">Type a word to start the chain. You will not get another chance.</p>
  <input id="wordInput" data-i18n-placeholder="placeholder" type="text" placeholder="Enter a word" />
  <button id="addBtn" data-i18n="add" onclick="addWord()">Add</button>
  <div id="feedback" role="status" aria-live="polite"></div>
  <div id="chain"></div>

  <div id="gameOver">
    <h2 data-i18n="gameOverTitle">THE CHAIN HAS BROKEN</h2>
    <p data-i18n="gameOverBody">Somewhere, a raccoon weeps. Try again.</p>
    <button data-i18n="retry" onclick="resetTimer()">Try Again</button>
  </div>

  <div id="frankSection">
    <h3 data-i18n="frankTitle">✨ Summon a Lisa Frank Guardian ✨</h3>
    <button id="frankBtn" data-i18n="frankBtn" onclick="generateFrankImage()">Manifest Image</button>
    <div id="frankStatus"></div>
    <img id="frankImg" alt="Lisa Frank style generated image" />
    <div id="songSection">
      <h3 data-i18n="songTitle">🎵 Song for this chain</h3>
      <div id="songStatus" data-i18n="songIdle">Manifest an image to get a song recommendation.</div>
      <pre id="songRecommendation" hidden></pre>
      <button id="songBtn" data-i18n="songBtn" onclick="recommendSong()" disabled>Recommend a song</button>
    </div>
  </div>

  <button id="settingsToggle" onclick="toggleSettings()">⚙</button>
  <div id="settingsPanel">
    <label>LiteLLM Base URL</label>
    <input id="cfgBaseUrl" placeholder="http://litellmwebapi.stg.justanswer.local" />
    <label>LiteLLM API Key</label>
    <input id="cfgApiKey" type="password" placeholder="sk-..." />
    <label>LiteLLM Chat Model</label>
    <input id="cfgChatModel" placeholder="gpt-4o-mini" />
    <button onclick="saveSettings()">Save (stored in this browser only)</button>
  </div>

  <script>
    // --- i18n ---
    const translations = {
      en: {
        urgent: "⚠ THE CHAIN MUST NOT BREAK ⚠",
        title: "Word Chain",
        subtitle: "Type a word to start the chain. You will not get another chance.",
        placeholder: "Enter a word",
        add: "Add",
        gameOverTitle: "THE CHAIN HAS BROKEN",
        gameOverBody: "Somewhere, a raccoon weeps. Try again.",
        retry: "Try Again",
        frankTitle: "✨ Summon a Lisa Frank Guardian ✨",
        frankBtn: "Manifest Image",
        frankLoading: "Consulting the neon spirits...",
        frankError: "The neon spirits did not answer. Check your LiteLLM settings (⚙) and network.",
        frankNoKey: "No API key configured. Click ⚙ in the corner and paste your LiteLLM key.",
        songTitle: "🎵 Song for this chain",
        songIdle: "Manifest an image to get a song recommendation.",
        songBtn: "Recommend a song",
        songLoading: "Matching the chain and guardian to a song...",
        songError: "The song oracle did not answer. Try again.",
        songNoKey: "Add LiteLLM settings before requesting a song.",
        emptyWord: "Enter a word first.",
        duplicateWord: "That word is already in this chain.",
        wrongLetter: "Your word must begin with \"{letter}\".",
        invalidWord: "That is not an English word.",
        checkingWord: "Checking your word...",
        acceptedWord: "Accepted. Keep the chain alive.",
      },
      es: {
        urgent: "⚠ LA CADENA NO DEBE ROMPERSE ⚠",
        title: "Cadena de Palabras",
        subtitle: "Escribe una palabra para iniciar la cadena. No tendrás otra oportunidad.",
        placeholder: "Escribe una palabra",
        add: "Añadir",
        gameOverTitle: "LA CADENA SE HA ROTO",
        gameOverBody: "En algún lugar, un mapache llora. Inténtalo de nuevo.",
        retry: "Reintentar",
        frankTitle: "✨ Invoca un Guardián Lisa Frank ✨",
        frankBtn: "Manifestar Imagen",
        frankLoading: "Consultando a los espíritus de neón...",
        frankError: "Los espíritus de neón no respondieron. Revisa tu configuración de LiteLLM (⚙) y tu red.",
        frankNoKey: "No hay clave API configurada. Haz clic en ⚙ y pega tu clave de LiteLLM.",
        songTitle: "🎵 Canción para esta cadena",
        songIdle: "Manifiesta una imagen para obtener una recomendación musical.",
        songBtn: "Recomendar una canción",
        songLoading: "Relacionando la cadena y el guardián con una canción...",
        songError: "El oráculo musical no respondió. Inténtalo de nuevo.",
        songNoKey: "Configura LiteLLM antes de pedir una canción.",
        emptyWord: "Primero escribe una palabra.",
        duplicateWord: "Esa palabra ya está en esta cadena.",
        wrongLetter: "Tu palabra debe empezar por \"{letter}\".",
        invalidWord: "Esa no es una palabra en español.",
        checkingWord: "Comprobando tu palabra...",
        acceptedWord: "Aceptada. Mantén viva la cadena.",
      },
    };
    let currentLang = "en";
    const chain = [];
    const usedWords = new Set();

    function setLang(lang) {
      currentLang = lang;
      document.getElementById("langEn").classList.toggle("active", lang === "en");
      document.getElementById("langEs").classList.toggle("active", lang === "es");
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = translations[lang][el.dataset.i18n];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.placeholder = translations[lang][el.dataset.i18nPlaceholder];
      });
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.getElementById("themeSelect").value = theme;
      try {
        localStorage.setItem("wordChainTheme", theme);
      } catch (error) {
        // The selected theme still applies when browser storage is unavailable.
      }
    }

    function loadTheme() {
      try {
        return localStorage.getItem("wordChainTheme") || "midnight";
      } catch (error) {
        return "midnight";
      }
    }

    function normalizedWord(word) {
      return word.trim().normalize("NFC").toLocaleLowerCase(currentLang);
    }

    function setFeedback(message, isSuccess = false) {
      const feedback = document.getElementById("feedback");
      feedback.textContent = message;
      feedback.classList.toggle("success", isSuccess);
    }

    function translate(key, replacements = {}) {
      return Object.entries(replacements).reduce(
        (message, [name, value]) => message.replace(`{${name}}`, value),
        translations[currentLang][key],
      );
    }

    async function validateWordWithLlm(word) {
      const { baseUrl, apiKey, chatModel } = loadSettings();
      if (!baseUrl || !apiKey) return true;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      const languageName = currentLang === "es" ? "Spanish" : "English";

      try {
        const res = await fetch(`${baseUrl}/v1/chat/completions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`,
          },
          signal: controller.signal,
          body: JSON.stringify({
            model: chatModel || "gpt-4o-mini",
            temperature: 0,
            max_tokens: 3,
            messages: [{
              role: "user",
              content: `Is \"${word}\" a real ${languageName} dictionary word? Reply with exactly VALID or INVALID. Do not accept names, phrases, abbreviations, or invented words.`,
            }],
          }),
        });

        if (!res.ok) return true;
        const data = await res.json();
        const verdict = data.choices?.[0]?.message?.content?.trim().toUpperCase();
        return verdict !== "INVALID";
      } catch (error) {
        return true;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function addWord() {
      const input = document.getElementById("wordInput");
      const addButton = document.getElementById("addBtn");
      const word = normalizedWord(input.value);

      if (!word) {
        setFeedback(translate("emptyWord"));
        return;
      }

      if (usedWords.has(word)) {
        setFeedback(translate("duplicateWord"));
        return;
      }

      const previousWord = chain.at(-1);
      if (previousWord && word[0] !== previousWord.at(-1)) {
        setFeedback(translate("wrongLetter", { letter: previousWord.at(-1) }));
        return;
      }

      addButton.disabled = true;
      input.disabled = true;
      setFeedback(translate("checkingWord"));
      const isValidWord = await validateWordWithLlm(word);
      addButton.disabled = false;
      input.disabled = false;

      if (!isValidWord) {
        setFeedback(translate("invalidWord"));
        input.focus();
        return;
      }

      chain.push(word);
      usedWords.add(word);
      document.getElementById("chain").textContent = chain.join(" -> ");
      input.value = "";
      input.focus();
      setFeedback(translate("acceptedWord"), true);
      resetTimer();
    }

    // --- urgency / countdown theater ---
    let timeLeft = 15;
    let timerHandle = null;

    function tick() {
      timeLeft -= 1;
      const timerEl = document.getElementById("timer");
      timerEl.textContent = timeLeft;
      timerEl.classList.toggle("critical", timeLeft <= 5);
      if (timeLeft <= 0) {
        clearInterval(timerHandle);
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      document.getElementById("gameOver").style.display = "block";
      document.body.classList.add("shaking");
      setTimeout(() => document.body.classList.remove("shaking"), 400);
    }

    function resetTimer() {
      clearInterval(timerHandle);
      timeLeft = 15;
      document.getElementById("timer").textContent = timeLeft;
      document.getElementById("timer").classList.remove("critical");
      document.getElementById("gameOver").style.display = "none";
      timerHandle = setInterval(tick, 1000);
    }

    // --- Lisa Frank image generation via LiteLLM proxy ---
    function toggleSettings() {
      const panel = document.getElementById("settingsPanel");
      const cfg = loadSettings();
      document.getElementById("cfgBaseUrl").value = cfg.baseUrl || "";
      document.getElementById("cfgApiKey").value = cfg.apiKey || "";
      document.getElementById("cfgChatModel").value = cfg.chatModel || "gpt-4o-mini";
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    function loadSettings() {
      try {
        return JSON.parse(localStorage.getItem("litellmSettings") || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveSettings() {
      const baseUrl = document.getElementById("cfgBaseUrl").value.trim();
      const apiKey = document.getElementById("cfgApiKey").value.trim();
      const chatModel = document.getElementById("cfgChatModel").value.trim();
      localStorage.setItem("litellmSettings", JSON.stringify({ baseUrl, apiKey, chatModel }));
      document.getElementById("settingsPanel").style.display = "none";
    }

    async function generateFrankImage() {
      const statusEl = document.getElementById("frankStatus");
      const imgEl = document.getElementById("frankImg");
      const songBtn = document.getElementById("songBtn");
      const { baseUrl, apiKey } = loadSettings();

      if (!apiKey || !baseUrl) {
        statusEl.textContent = translations[currentLang].frankNoKey;
        return;
      }

      statusEl.textContent = translations[currentLang].frankLoading;
      imgEl.style.display = "none";
      songBtn.disabled = true;
      document.getElementById("songRecommendation").hidden = true;
      document.getElementById("songStatus").textContent = translations[currentLang].songIdle;

      const chainDescription = chain.length ? chain.join(" → ") : "an empty word chain";

      try {
        const res = await fetch(`${baseUrl}/v1/images/generations`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: "dall-e-3",
            prompt:
              `Lisa Frank style 1990s rainbow neon sticker art of a mythical glitter creature guarding a chain of glowing letters. The word chain is: ${chainDescription}. Make the chain's words visually meaningful in the scene. Use extremely vivid colors, airbrushing, unicorns, and lightning bolts.`,
            n: 1,
            size: "1024x1024",
          }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const item = data.data && data.data[0];
        const src = item && (item.url || (item.b64_json && `data:image/png;base64,${item.b64_json}`));
        if (!src) throw new Error("No image in response");

        imgEl.src = src;
        imgEl.style.display = "block";
        statusEl.textContent = "";
        songBtn.disabled = false;
        recommendSong(src);
      } catch (err) {
        statusEl.textContent = translations[currentLang].frankError;
        document.getElementById("songStatus").textContent = translations[currentLang].songIdle;
      }
    }

    // --- Song recommendation from the current chain + generated image ---
    async function recommendSong(imageSrc = document.getElementById("frankImg").src) {
      const statusEl = document.getElementById("songStatus");
      const recommendationEl = document.getElementById("songRecommendation");
      const button = document.getElementById("songBtn");
      const { baseUrl, apiKey, chatModel } = loadSettings();

      if (!apiKey || !baseUrl) {
        statusEl.textContent = translations[currentLang].songNoKey;
        return;
      }
      if (!imageSrc) {
        statusEl.textContent = translations[currentLang].songIdle;
        return;
      }

      const chainDescription = chain.length ? chain.join(" → ") : "(no words entered yet)";
      button.disabled = true;
      recommendationEl.hidden = true;
      statusEl.textContent = translations[currentLang].songLoading;

      try {
        const res = await fetch(`${baseUrl}/v1/chat/completions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: chatModel || "gpt-4o-mini",
            temperature: 0.7,
            max_tokens: 180,
            messages: [
              {
                role: "system",
                content: "You are a music curator. Recommend exactly one real song that best matches both the word chain and the attached image. Reply in exactly this format: Song: <title>\nArtist: <artist>\nWhy: <one concise sentence>. Do not invent a song or artist.",
              },
              {
                role: "user",
                content: [
                  { type: "text", text: `Word chain: ${chainDescription}\nChoose a song that captures the mood, imagery, and progression.` },
                  { type: "image_url", image_url: { url: imageSrc } },
                ],
              },
            ],
          }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const recommendation = data.choices?.[0]?.message?.content?.trim();
        if (!recommendation) throw new Error("No recommendation returned");

        recommendationEl.textContent = recommendation;
        recommendationEl.hidden = false;
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = translations[currentLang].songError;
      } finally {
        button.disabled = false;
      }
    }

    // --- init ---
    setLang("en");
    setTheme(loadTheme());
    document.getElementById("wordInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") addWord();
    });
    resetTimer();
  </script>
</body>
</html>
