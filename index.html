<!DOCTYPE html>
<html>
<head>
  <title>Word Chain</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; text-align: center; }
    input { font-size: 1.2rem; padding: 8px; }
    button { font-size: 1.2rem; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Word Chain</h1>
  <p>Type a word to start the chain.</p>
  <input id="wordInput" type="text" placeholder="Enter a word" />
  <button onclick="addWord()">Add</button>
  <div id="chain"></div>

  <script>
    function addWord() {
      const val = document.getElementById('wordInput').value;
      document.getElementById('chain').innerText = val;
      // Nothing here yet — build me! Should check last letter matches next word's first letter.
    }
  </script>
</body>
</html>
